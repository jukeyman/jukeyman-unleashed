name: RJ CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './node_modules/*' -print0 | xargs -0 -r shellcheck -S warning
